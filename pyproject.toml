[project]
name = "vendorwise"
version = "1.0.0"
description = "Evidence-backed laptop quotation auditing with RAG"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi", "uvicorn", "pydantic", "python-multipart", "python-dotenv",
  "streamlit", "httpx", "openai", "pypdf", "reportlab",
  "fastembed", "qdrant-client", "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "pypdfium2", "ty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: local integration tests using fixture data",
  "mocked: mocked provider contract tests, not live model quality",
  "live: opt-in external provider calls (may incur charges)",
]
