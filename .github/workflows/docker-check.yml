name: Tests and Docker check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run the complete test suite
        run: python -m pytest -q
      - name: Check types
        run: ty check vendorwise streamlit_app.py scripts
  docker-demo:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: docker build -t vendorwise-check .
      - name: Run sample demo
        run: docker run -d --name vendorwise-check -e VENDORWISE_MODE=fixture -e VENDORWISE_PUBLIC_DEMO=true -p 127.0.0.1:7860:7860 vendorwise-check
      - name: Wait for frontend
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:7860/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs vendorwise-check
          exit 1
      - name: Verify real container workflow
        run: docker exec vendorwise-check python -m scripts.smoke_container
      - name: Show logs and stop container
        if: always()
        run: |
          docker logs vendorwise-check || true
          docker rm -f vendorwise-check || true
