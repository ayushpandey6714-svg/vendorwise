services:
  - type: web
    name: vendorwise-demo
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "7860"
      - key: VENDORWISE_MODE
        value: live
      - key: VENDORWISE_PUBLIC_DEMO
        value: "false"
      - key: EMBEDDING_BACKEND
        value: tfidf
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
